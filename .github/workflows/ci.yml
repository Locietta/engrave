name: CI

# Build and unit-test lane for the engrave engine fork.
#
# Runs on Windows and Linux with Bazel + hermetic xclang 23: builds the release
# unit-test closure, and runs the C++ unit test binaries plus the fast Python
# checks. The engine gate (tests/gate.py), the golden comparisons and the audio
# corpus stay manual: they need the SoundFont and the full `engine_tests`
# build, and are validated on the physical Windows and Linux hosts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  python-checks:
    name: python-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install the pinned validation closure
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pip install -e .

      - name: Asset installer checks
        run: python tools/test_install_assets.py

      - name: Golden comparator and inventory mutations
        run: python tests/test_inventory.py

      - name: MNX model is generated from the schema
        run: >
          python tools/mnx_codegen.py --check
          src/importexport/mnx/model/mnx-schema.json
          src/importexport/mnx/model/mnx_model.h

      - name: Playback witness controls
        run: |
          python tests/test_playback_witness.py
          python -O tests/test_playback_witness.py

  build-test:
    name: build-test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-xclang
            runner: windows-latest
          - name: linux-xclang
            runner: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_DIR: build/ci
      REPO_CACHE: build/.bazel_repo_cache
      DISK_CACHE: build/.bazel_disk_cache
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux runtime fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install the pinned validation closure
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pip install -e .

      - name: Install the Pixi environment (cairo, zlib)
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.84.1
          locked: true
          cache: true

      - name: Restore Bazel repository cache
        id: repo-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.REPO_CACHE }}
          key: bazel-repo-${{ matrix.name }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'bazel/deps.bzl') }}
          restore-keys: bazel-repo-${{ matrix.name }}-

      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DISK_CACHE }}
          key: bazel-disk-${{ matrix.name }}-${{ github.sha }}
          restore-keys: bazel-disk-${{ matrix.name }}-

      - name: Build unit-test targets
        id: build
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = $PWD.Path
          $pixiPrefix = Join-Path $root '.pixi/envs/default'
          $rev = (git rev-parse HEAD).Substring(0, 7)
          New-Item -ItemType Directory -Force $env:BUILD_DIR, $env:REPO_CACHE, $env:DISK_CACHE | Out-Null
          $bep = Join-Path $env:BUILD_DIR 'bep.json'
          $targets = @(
            '//:engrave_api_test', '//:engrave_handles_test', '//:engrave_describe_test',
            '//:engrave_read_test', '//:engrave_ops_test',
            '//:engrave_gp_import_test', '//:engrave_mnx_import_test', '//:engrave_mnx_model_test',
            '//:diagnostics_test', '//:io_boundary_test',
            '//:engraving_playback_tests', '//:mpe_tests', '//:example_embedder'
          )
          bazelisk build `
            --config=release `
            "--repository_cache=$root/$env:REPO_CACHE" `
            --repo_contents_cache= `
            "--disk_cache=$root/$env:DISK_CACHE" `
            "--repo_env=ENGRAVE_PIXI_PREFIX=$pixiPrefix" `
            "--repo_env=ENGRAVE_GIT_REVISION=$rev" `
            "--symlink_prefix=$root/$env:BUILD_DIR/.bazel-symlinks/" `
            --jobs=4 `
            "--build_event_json_file=$bep" `
            @targets
          python -c "from pathlib import Path; from tests.gate import _stage_bep_outputs; _stage_bep_outputs(Path(r'$bep'), Path(r'$env:BUILD_DIR'))"

      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.repo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.REPO_CACHE }}
          key: bazel-repo-${{ matrix.name }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'bazel/deps.bzl') }}

      - name: Save Bazel disk cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DISK_CACHE }}
          key: bazel-disk-${{ matrix.name }}-${{ github.sha }}

      - name: Install runtime assets and verify the manifest
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = Join-Path $env:RUNNER_TEMP 'assets'
          python tools/install_assets.py $assets
          python tools/install_assets.py $assets --verify

      - name: Run C++ unit tests
        run: |
          $ErrorActionPreference = 'Stop'
          $ext = $IsWindows ? '.exe' : ''
          $root = $PWD.Path
          $build = Join-Path $root $env:BUILD_DIR
          if ($IsWindows) {
            $env:PATH = (Join-Path $root '.pixi/envs/default/Library/bin') + [IO.Path]::PathSeparator + $env:PATH
          } else {
            $env:LD_LIBRARY_PATH = (Join-Path $root '.pixi/envs/default/lib') + ($env:LD_LIBRARY_PATH ? ":$env:LD_LIBRARY_PATH" : '')
          }
          $assets = Join-Path $env:RUNNER_TEMP 'assets'
          $data = Join-Path $root 'tests/data/inputs'
          $python = (Get-Command python).Source
          $mnxOut = Join-Path $env:RUNNER_TEMP 'mnx-export'
          $suites = [ordered]@{
            engrave_api_test        = @("--assets=$assets")
            engrave_handles_test    = @("--assets=$assets", "--corpus=$data/golden")
            engrave_describe_test   = @("--assets=$assets", "--python=$python", $data)
            engrave_read_test       = @("--assets=$assets", "--corpus=$data")
            engrave_ops_test        = @("--assets=$assets", "--corpus=$data/golden")
            engrave_gp_import_test  = @("--assets=$assets")
            engrave_mnx_import_test = @("--assets=$assets", "--mnx-out=$mnxOut")
            engrave_mnx_model_test  = @()
            diagnostics_test        = @()
            io_boundary_test        = @()
          }
          $failed = @()
          foreach ($name in $suites.Keys) {
            $work = Join-Path $env:RUNNER_TEMP "suites/$name"
            New-Item -ItemType Directory -Force $work | Out-Null
            Write-Host "::group::$name"
            Push-Location $work
            & (Join-Path $build "$name$ext") @($suites[$name])
            $code = $LASTEXITCODE
            Pop-Location
            Write-Host '::endgroup::'
            if ($code -ne 0) {
              Write-Host "::error title=$name::exited with code $code"
              $failed += $name
            }
          }
          if ($failed) { throw "failed suites: $($failed -join ', ')" }

      - name: Run upstream gtest suites (engraving playback, MPE)
        run: |
          if ($IsWindows) {
            $env:PATH = (Join-Path $PWD '.pixi/envs/default/Library/bin') + [IO.Path]::PathSeparator + $env:PATH
          } else {
            $env:LD_LIBRARY_PATH = (Join-Path $PWD '.pixi/envs/default/lib') + ($env:LD_LIBRARY_PATH ? ":$env:LD_LIBRARY_PATH" : '')
          }
          python tests/integration/test_upstream_gtest.py `
            --bin-dir "$env:BUILD_DIR" `
            --assets "$env:RUNNER_TEMP/assets" `
            --engraving-data src/engraving/tests `
            --output "$env:RUNNER_TEMP/gtest"

      - name: Validate exported MNX against the schema
        run: >
          python tests/engrave_testing/check_mnx_schema.py
          "$env:RUNNER_TEMP/mnx-export"
          src/importexport/mnx/model/mnx-schema.json
