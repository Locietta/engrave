name: CI

# Windows and Linux run release unit tests and SoundFont-free goldens with
# hermetic xclang 23. Linux also runs the core and upstream suites and the
# golden probes with ASan, LSan, and UBSan. The audio corpus is a manual gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  python-checks:
    name: python-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install the pinned validation closure
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pip install -e .

      - name: Asset installer, PID generator, and Bazel MCP checks
        run: |
          python tools/test_install_assets.py
          python tools/test_gen_pid_support.py
          python tools/gen_pid_support.py --check
          python tools/test_bazel_server_mcp.py

      - name: Golden comparator and inventory mutations
        run: python tests/test_inventory.py

      - name: MNX model is generated from the schema
        run: >
          python tools/mnx_codegen.py --check
          src/importexport/mnx/model/mnx-schema.json
          src/importexport/mnx/model/mnx_model.h

      - name: Playback witness controls
        run: |
          python tests/test_playback_witness.py
          python -O tests/test_playback_witness.py

  build-test:
    name: build-test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-xclang
            runner: windows-latest
          - name: linux-xclang
            runner: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_DIR: build/ci
      REPO_CACHE: build/.bazel_repo_cache
      DISK_CACHE: build/.bazel_disk_cache
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux runtime fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install the pinned validation closure
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pip install -e .

      - name: Install the Pixi environment (cairo, zlib)
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.84.1
          locked: true
          cache: true

      - name: Restore Bazel repository cache
        id: repo-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.REPO_CACHE }}
          key: bazel-repo-${{ matrix.name }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'bazel/deps.bzl') }}
          restore-keys: bazel-repo-${{ matrix.name }}-

      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DISK_CACHE }}
          key: bazel-disk-${{ matrix.name }}-${{ github.sha }}
          restore-keys: bazel-disk-${{ matrix.name }}-

      - name: Build unit-test targets
        id: build
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = $PWD.Path
          $pixiPrefix = Join-Path $root '.pixi/envs/default'
          $rev = (git rev-parse HEAD).Substring(0, 7)
          New-Item -ItemType Directory -Force $env:BUILD_DIR, $env:REPO_CACHE, $env:DISK_CACHE | Out-Null
          $bep = Join-Path $env:BUILD_DIR 'bep.json'
          $targets = @(
            '//:engrave_core_tests', '//:engraving_playback_tests', '//:mpe_tests', '//:example_embedder',
            '//:engrave_output_probe', '//:semantic_dump'
          )
          bazelisk build `
            --config=release `
            "--repository_cache=$root/$env:REPO_CACHE" `
            --repo_contents_cache= `
            "--disk_cache=$root/$env:DISK_CACHE" `
            "--repo_env=ENGRAVE_PIXI_PREFIX=$pixiPrefix" `
            "--repo_env=ENGRAVE_GIT_REVISION=$rev" `
            "--symlink_prefix=$root/$env:BUILD_DIR/.bazel-symlinks/" `
            --jobs=4 `
            --output_groups=+runtime_dynamic_libraries `
            "--build_event_json_file=$bep" `
            @targets
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'tests'); from gate import _stage_bep_outputs; _stage_bep_outputs(Path(sys.argv[1]), Path(sys.argv[2]))" $bep $env:BUILD_DIR

      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.repo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.REPO_CACHE }}
          key: bazel-repo-${{ matrix.name }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'bazel/deps.bzl') }}

      - name: Save Bazel disk cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DISK_CACHE }}
          key: bazel-disk-${{ matrix.name }}-${{ github.sha }}

      - name: Install runtime assets and verify the manifest
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = Join-Path $env:RUNNER_TEMP 'assets'
          python tools/install_assets.py $assets
          python tools/install_assets.py $assets --verify

      - name: Run C++ unit tests
        run: |
          $ErrorActionPreference = 'Stop'
          $ext = $IsWindows ? '.exe' : ''
          $root = $PWD.Path
          $build = Join-Path $root $env:BUILD_DIR
          if ($IsWindows) {
            $env:PATH = (Join-Path $root '.pixi/envs/default/Library/bin') + [IO.Path]::PathSeparator + $env:PATH
          } else {
            $env:LD_LIBRARY_PATH = (Join-Path $root '.pixi/envs/default/lib') + ($env:LD_LIBRARY_PATH ? ":$env:LD_LIBRARY_PATH" : '')
          }
          $assets = Join-Path $env:RUNNER_TEMP 'assets'
          $data = Join-Path $root 'tests/data/inputs'
          $python = (Get-Command python).Source
          $mnxOut = Join-Path $env:RUNNER_TEMP 'mnx-export'
          $work = Join-Path $env:RUNNER_TEMP 'suites/engrave_core_tests'
          New-Item -ItemType Directory -Force $work | Out-Null
          Push-Location $work
          & (Join-Path $build "engrave_core_tests$ext") `
            "--assets=$assets" `
            "--golden-corpus=$data/golden" `
            "--inputs-corpus=$data" `
            "--python=$python" `
            "--mnx-out=$mnxOut"
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) {
            Write-Host "::error title=engrave_core_tests::exited with code $code"
            throw "engrave_core_tests exited with code $code"
          }

      - name: Run upstream gtest suites (engraving playback, MPE)
        run: |
          if ($IsWindows) {
            $env:PATH = (Join-Path $PWD '.pixi/envs/default/Library/bin') + [IO.Path]::PathSeparator + $env:PATH
          } else {
            $env:LD_LIBRARY_PATH = (Join-Path $PWD '.pixi/envs/default/lib') + ($env:LD_LIBRARY_PATH ? ":$env:LD_LIBRARY_PATH" : '')
          }
          python tests/integration/test_upstream_gtest.py `
            --bin-dir "$env:BUILD_DIR" `
            --assets "$env:RUNNER_TEMP/assets" `
            --engraving-data src/engraving/tests `
            --output "$env:RUNNER_TEMP/gtest"

      - name: Validate exported MNX against the schema
        run: >
          python tests/engrave_testing/check_mnx_schema.py
          "$env:RUNNER_TEMP/mnx-export"
          src/importexport/mnx/model/mnx-schema.json

      - name: Compare SoundFont-free goldens
        run: >
          python tests/gate.py --no-audio --goldens-only --skip-build
          --build-dir "$env:BUILD_DIR" --assets "$env:RUNNER_TEMP/assets"
          --output "$env:RUNNER_TEMP/release-goldens" -J 4

  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILD_DIR: build/sanitize
      REPO_CACHE: build/.bazel_repo_cache
      DISK_CACHE: build/.bazel_disk_cache
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux runtime fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install the pinned validation closure
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pip install -e .

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.84.1
          locked: true
          cache: true

      - name: Restore Bazel repository cache
        id: repo-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.REPO_CACHE }}
          key: bazel-repo-linux-xclang-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'bazel/deps.bzl') }}
          restore-keys: bazel-repo-linux-xclang-

      - name: Restore sanitized Bazel disk cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DISK_CACHE }}
          key: bazel-disk-linux-sanitize-${{ github.sha }}
          restore-keys: bazel-disk-linux-sanitize-

      - name: Build sanitized engine tests and probes
        id: build
        run: |
          mkdir -p "$BUILD_DIR" "$REPO_CACHE" "$DISK_CACHE"
          bep="$PWD/$BUILD_DIR/bep.json"
          bazelisk build --config=sanitize --jobs=4 \
            --repository_cache="$PWD/$REPO_CACHE" --repo_contents_cache= \
            --disk_cache="$PWD/$DISK_CACHE" \
            --repo_env=ENGRAVE_PIXI_PREFIX="$PWD/.pixi/envs/default" \
            --repo_env=ENGRAVE_GIT_REVISION="$(git rev-parse --short=7 HEAD)" \
            --symlink_prefix="$PWD/$BUILD_DIR/.bazel-symlinks/" \
            --output_groups=+runtime_dynamic_libraries --build_event_json_file="$bep" \
            //:engrave_core_tests //:engraving_playback_tests //:mpe_tests //:engrave_output_probe //:semantic_dump
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'tests'); from gate import _stage_bep_outputs; _stage_bep_outputs(Path(sys.argv[1]), Path(sys.argv[2]))" "$bep" "$BUILD_DIR"

      - name: Install runtime assets
        run: python tools/install_assets.py "$RUNNER_TEMP/assets"

      - name: Run sanitized core and upstream suites
        run: |
          export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          assets="$RUNNER_TEMP/assets"
          data="$PWD/tests/data/inputs"
          build="$PWD/$BUILD_DIR"
          py="$(command -v python)"
          for shard in 0 1 2 3; do
            work="$RUNNER_TEMP/suites/core-$shard"
            mkdir -p "$work/tmp"
            (cd "$work" && TMPDIR="$work/tmp" GTEST_TOTAL_SHARDS=4 GTEST_SHARD_INDEX="$shard" \
              "$build/engrave_core_tests" --assets="$assets" --golden-corpus="$data/golden" \
              --inputs-corpus="$data" --python="$py" --mnx-out="$RUNNER_TEMP/mnx-export")
          done
          python tests/engrave_testing/check_mnx_schema.py "$RUNNER_TEMP/mnx-export" \
            src/importexport/mnx/model/mnx-schema.json
          python tests/integration/test_upstream_gtest.py --bin-dir "$build" --assets "$assets" \
            --engraving-data src/engraving/tests --output "$RUNNER_TEMP/gtest"

      - name: Compare sanitized SoundFont-free goldens
        run: >
          python tests/gate.py --no-audio --goldens-only --skip-build --profile sanitize
          --build-dir "$BUILD_DIR" --assets "$RUNNER_TEMP/assets"
          --output "$RUNNER_TEMP/sanitized-goldens" -J 4

      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.repo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.REPO_CACHE }}
          key: bazel-repo-linux-xclang-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'bazel/deps.bzl') }}

      - name: Save sanitized Bazel disk cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DISK_CACHE }}
          key: bazel-disk-linux-sanitize-${{ github.sha }}
